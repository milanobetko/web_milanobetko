<style>
:root{--paper:#FAFAF7;--panel:#EEEFEA;--ink:#111312;--grey:#55595A;--yel:#FFE45C;--pnk:#FFC2D6;
--hd:'Barlow Condensed','Arial Narrow','Liberation Sans Narrow',sans-serif;
--tx:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
--grn:#9DF29A;--mo:'Courier Prime','Courier New',Courier,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--tx);font-size:16px;line-height:1.55}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.top{border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-family:var(--mo);font-weight:700;font-size:16px;letter-spacing:.14em;background:none;border:0;padding:8px 0}
.ver{font-family:var(--mo);font-size:14px;color:var(--grey)}
main{padding:28px 0 120px;min-height:70vh}
.screen{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.fill{transition:none!important}}
.lab{font-family:var(--mo);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
h1,h2,h3{font-family:var(--hd);font-weight:700;line-height:1.02;margin:0;text-transform:uppercase}
h1{font-size:clamp(46px,13vw,76px)}
h2{font-size:clamp(32px,8vw,44px)}
h3{font-size:24px}
.hlA{background:var(--yel);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hlG{background:var(--grn);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hlB{background:var(--pnk);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-style:italic;font-size:19px;margin:18px 0 28px;max-width:30ch}
.cards{display:grid;gap:10px;margin:0 0 26px}
.pcard{display:block;width:100%;text-align:left;border:2px solid var(--ink);padding:14px 16px;min-height:48px}
.pcard.A,.badge.A{background:var(--yel)}.pcard.B,.badge.B{background:var(--pnk)}
.pcard .row{display:flex;gap:12px;align-items:center}
.badge{width:36px;height:36px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mo);font-weight:700;flex:none;background:var(--paper)}
.pcard.A .badge,.pcard.B .badge{background:var(--paper)}
.pcard .t{font-family:var(--hd);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.pcard .d{font-size:16px;margin-top:8px}
.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 18px;min-height:40px;font-family:var(--mo);font-weight:700;font-size:18px;text-align:center}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.sm{width:auto;display:inline-block;min-height:48px;padding:10px 16px;font-size:16px}
.ref{font:inherit;font-size:15px;background:none;border:0;padding:0;margin:0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;color:var(--ink);cursor:pointer}
.more>summary{background:var(--panel)}
.plan{border:2px solid var(--ink);background:var(--panel);padding:18px;margin:26px 0 0}
.plan .btn{margin-top:16px;text-decoration:none;background:var(--grn);color:var(--ink);font-size:16px;white-space:nowrap;padding:9px 8px;display:flex;align-items:center;justify-content:center}
.foot{margin-top:34px;border-top:2px solid var(--ink);padding-top:20px}
.foot h3{font-size:22px;margin-top:18px}
.lnk{display:block;text-align:center;margin-top:16px;padding:12px;background:none;border:0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-size:16px;width:100%}
.note{font-size:16px;color:var(--grey);margin-top:22px}
.bar{height:12px;border:2px solid var(--ink);background:var(--paper);margin:10px 0 24px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center}
.back{border:2px solid var(--ink);background:var(--paper);min-height:48px;min-width:48px;font-family:var(--mo);font-weight:700;font-size:16px;padding:0 14px}
.q{font-family:var(--mo);font-weight:700;font-size:clamp(22px,6vw,28px);line-height:1.25;margin:6px 0 24px}
.ans{display:grid;gap:10px}
.arow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--ink);background:var(--paper);padding:12px 14px;min-height:56px;font-size:18px}
.box{width:26px;height:26px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mo);font-weight:700;background:var(--paper)}
.arow.on.A{background:var(--yel)}.arow.on.B{background:var(--pnk)}
.arow.on .box::after{content:"✓"}
.hint{background:var(--panel);border:1px solid var(--ink);padding:12px 14px;margin-top:20px;font-size:16px}
.blockscr{padding-top:20px}
.blockscr .badge{width:64px;height:64px;font-size:30px;margin-bottom:18px}
.score{border:2px solid var(--ink);margin:0 0 22px;background:var(--paper)}
.score .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:2px solid var(--ink)}
.score.A .hd{background:var(--yel)}.score.B .hd{background:var(--pnk)}
.pct{font-family:var(--hd);font-weight:700;font-size:64px;line-height:.9;white-space:nowrap;flex:none}
.band{font-family:var(--mo);font-weight:700;font-size:18px;margin-top:6px}
.sb{padding:16px}
.ruler{position:relative;height:18px;border:2px solid var(--ink);margin:6px 0 30px;background:var(--paper)}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .7s ease-out}
.score.A .fill{background:var(--yel);border-right:2px solid var(--ink)}.score.B .fill{background:var(--pnk);border-right:2px solid var(--ink)}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.tl{position:absolute;top:22px;font-family:var(--mo);font-size:14px;transform:translateX(-50%)}
.gap{border-top:1px solid var(--ink);padding:14px 0}
.gap:first-of-type{border-top:0}
.tag{display:inline-block;font-family:var(--mo);font-weight:700;font-size:14px;padding:1px 8px;border:2px solid var(--ink);margin-bottom:8px}
.tag.A{background:var(--yel)}.tag.B{background:var(--pnk)}
.gap .gq{font-weight:500}
.gap .gs{margin-top:4px}
.ok{background:var(--panel);border:1px solid var(--ink);padding:12px 14px}
.confirm{border:2px solid var(--ink);padding:14px;margin-top:16px;background:var(--panel)}
.confirm .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.parthead{padding:20px 18px;border:2px solid var(--ink);margin-bottom:22px}
.parthead.A{background:var(--yel)}.parthead.B{background:var(--pnk)}
.parthead .claim{margin:0 0 14px;font-weight:700}
.parthead .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.parthead p{margin:12px 0 0;font-size:18px}
.intro p{margin:0 0 14px;max-width:62ch}
.lead{font-family:var(--tx);font-weight:700}
.leadp{font-family:var(--tx)}
.video{border:2px solid var(--ink);margin:22px 0 8px;background:var(--panel)}
.vbtn{display:flex;width:100%;aspect-ratio:16/9;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--panel);border:0;font-family:var(--mo);font-weight:700;font-size:20px}
.vbtn .pl{width:64px;height:64px;border:2px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:24px}
.video iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.vlink{font-size:16px;margin:0 0 26px}
details{border:2px solid var(--ink);margin:0 0 10px;background:var(--paper)}
summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:56px;display:flex;align-items:center;gap:12px;font-family:var(--hd);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
summary::-webkit-details-marker{display:none}
summary .pm{margin-left:auto;font-family:var(--mo);font-size:22px;flex:none}
summary .pm::before{content:"+"}
details[open] summary .pm::before{content:"–"}
details[open] summary{border-bottom:2px solid var(--ink)}
.dbody{padding:16px}
.dbody h4{font-family:var(--mo);font-size:18px;margin:20px 0 8px}
.dbody h4:first-child{margin-top:0}
.dbody p{margin:0 0 12px}
.dbody ul,.dbody ol{margin:0 0 14px;padding-left:22px}
.dbody li{margin:0 0 6px}
.dbody ul.chk{list-style:none;padding-left:0}
.dbody ul.chk li{padding-left:34px;position:relative}
.dbody ul.chk li::before{content:"";position:absolute;left:0;top:3px;width:20px;height:20px;border:2px solid var(--ink)}
.dbody blockquote{margin:0 0 14px;border:1px solid var(--ink);background:var(--panel);padding:12px 14px;font-family:var(--mo)}
.src{font-size:16px;color:var(--grey)}
.src a{color:var(--ink)}
.tw{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:1px solid var(--ink);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);font-family:var(--mo);font-size:14px}
.num{font-family:var(--mo);font-weight:700}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:.8fr 1.1fr 1.1fr}
nav.bot button{background:var(--paper);border:0;border-right:2px solid var(--ink);min-height:60px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.bot button:last-child{border-right:0}
nav.bot .nl{font-family:var(--mo);font-weight:700;font-size:14px}
nav.bot .ns{font-size:14px;color:var(--grey);line-height:1.1;text-align:center}
nav.bot button.A .ns,nav.bot button.B .ns{color:var(--ink);font-weight:600}
nav.bot button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.bot button[aria-current="page"] .ns{color:var(--paper)}
nav.bot button.A:not([aria-current]) .nl{background:var(--yel);padding:0 6px}
nav.bot button.B:not([aria-current]) .nl{background:var(--pnk);padding:0 6px}
footer.foot{border-top:1px solid var(--ink);padding:22px 0 130px;font-size:16px;color:var(--grey)}
footer.foot p{margin:0 0 8px}
@media (min-width:760px){main{padding-top:44px}}
</style>

<script>
/* LOGIC START */
var QS=[
{id:'A1',p:'A',q:'Máte doma vodu, jedlo a základné zásoby aspoň na 3 dni pre každého?',s:'Voda 3 až 5 litrov na osobu denne, jedlo bez varenia, rádio, baterky, powerbanky, lieky, hotovosť a kópie dokladov.',sec:'zasoby'},
{id:'A2',p:'A',q:'Máte s blízkymi dohodu, ako sa spojíte a kde sa stretnete?',s:'Jedna rodinná skupina, pri výpadku internetu SMS, hlásenia o 9.00 a 18.00, dve miesta stretnutia.',sec:'spojenie'},
{id:'A3',p:'A',q:'Má každý člen domácnosti pripravený evakuačný batoh?',s:'Osobná batožina pre každého, taká ľahká, aby ju nositeľ uniesol.',sec:'batohy'},
{id:'B1',p:'B',q:'Máte účty zabezpečené správcom hesiel, dvojfaktorovým overením a obnovovacími kódmi na papieri?',s:'Pre každý účet iné heslo, dvojfaktorové overenie všade, kde sa dá, a obnovovacie kódy na papieri v uzamknutom mieste.',sec:'pristup'},
{id:'B2',p:'B',q:'Máte v rodine dohodnutú súkromnú overovaciu frázu?',s:'Dohodnite ju osobne a nikam ju nezapisujte do zdieľaných miest.',sec:'podvod'},
{id:'B3',p:'B',q:'Vie každý v rodine, čo urobiť, keď niekto naliehavo žiada peniaze?',s:'Ukončiť hovor, zavolať na už uložené číslo, overiť cez ďalšieho člena rodiny. Kódy, PIN ani prihlasovacie údaje nikomu.',sec:'podvod'}
];
var PTS={yes:2,part:1,no:0};
function calc(ans,p){var pts=0,max=0;QS.forEach(function(q,i){if(q.p!==p)return;var a=ans[i];if(a==='na')return;max+=2;if(a in PTS)pts+=PTS[a]});return {pts:pts,max:max,pct:max?Math.round(pts/max*100):0}}
function band(pct){return pct>=75?'Si pripravený':pct>=40?'Si na dobrej ceste':'Začínaš'}
function gaps(ans,p){var no=[],pa=[];QS.forEach(function(q,i){if(q.p!==p)return;if(ans[i]==='no')no.push(q);else if(ans[i]==='part')pa.push(q)});return no.concat(pa).slice(0,3)}
/* LOGIC END */
</script>
<script>
var PART={A:{name:'Mimoriadne situácie',sub:'Prvých 72 hodín',short:'Situácie'},B:{name:'Hrozby AI doby',sub:'Heslá, podvody a informácie bez internetu',short:'AI doba'}};
var MV='https://www.minv.sk/swift_data/source/verejna_sprava/obu_trencin/informacie_pre_obcanov/okr/2025/Brozura%20co%20robit%20v%20pripade%20krizy%20alebo%20ozbrojeneho%20konfliktu.pdf';
function RF(i,t){return '<button class="ref" data-ref="'+i+'">'+t+' ↗</button>'}
var SEC={A:[
{id:'voda',t:'Zásoby vody podľa počtu osôb',h:'<div class="tw"><table><thead><tr><th>Počet osôb</th><th>Zásoba na 72 hodín pri 3 l denne na osobu</th><th>Zásoba pri 5 l denne na osobu</th></tr></thead><tbody><tr><td class="num">1</td><td>9 litrov</td><td>15 litrov</td></tr><tr><td class="num">2</td><td>18 litrov</td><td>30 litrov</td></tr><tr><td class="num">3</td><td>27 litrov</td><td>45 litrov</td></tr><tr><td class="num">4</td><td>36 litrov</td><td>60 litrov</td></tr><tr><td class="num">5</td><td>45 litrov</td><td>75 litrov</td></tr><tr><td class="num">6</td><td>54 litrov</td><td>90 litrov</td></tr></tbody></table></div><p>Výpočet: <strong>počet ľudí × denná zásoba na osobu × 3 dni</strong>.</p><p>Ide o vodu na pitie a základnú prípravu jedla; vodu na hygienu a toaletu pripravte navyše. Slovenská príručka uvádza 3 až 5 litrov pitnej vody na osobu denne.</p><p>Vodu skladujte v čistých uzavretých nádobách na chladnom a tmavom mieste. Balenú vodu priebežne spotrebúvajte a dopĺňajte.</p><p class="src">Zdroj: <a href="'+MV+'" target="_blank" rel="noopener">Slovenská príručka MV SR</a>.</p>'},
{id:'zasoby',t:'Čo má mať doma každá domácnosť',h:'<p>Tento zoznam prejdite osobitne v každej zapojenej domácnosti.</p><ul class="chk"><li><strong>Voda</strong> podľa tabuľky a nádoby na ďalšiu vodu.</li><li><strong>Jedlo na tri dni pre každého</strong>, ktoré sa dá jesť bez varenia a chladničky: konzervované ryby, mäso, fazuľa, cícer, hotové jedlá vhodné aj za studena, orechy, sucháre, trvanlivé pečivo a ovocné konzervy. Vyberajte to, čo bežne jete a znášate.</li><li><strong>Ručný otvárač konzerv</strong> a základný príbor. Ryža a cestoviny sú doplnok, ak máte bezpečnú možnosť varenia a vodu.</li><li><strong>Baterka alebo čelovka pre každého</strong>, náhradné batérie.</li><li><strong>Nabité powerbanky</strong>, vhodné káble a nabíjačky.</li><li><strong>Aspoň jedno rádio na batérie alebo kľuku v každej domácnosti</strong>. Vopred ho nalaďte a vyskúšajte.</li><li><strong>Pravidelné lieky aspoň na 72 hodín</strong>, papierový zoznam názvov a dávkovania, potrebné zdravotnícke pomôcky a náhradné okuliare. Osobitné skladovanie liekov overte podľa príbalového letáka.</li><li><strong>Lekárnička</strong> s obväzmi, náplasťami, dezinfekciou, rukavicami a teplomerom.</li><li><strong>Teplé oblečenie, deky alebo spacáky</strong>, pevná obuv a ochrana pred dažďom.</li><li><strong>Hygiena</strong>: toaletný papier, mydlo, vlhčené obrúsky, hygienické potreby, vrecia na odpad a vedro s vekom na núdzové použitie.</li><li><strong>Hotovosť v menších bankovkách a minciach</strong>. Sumu si určte podľa bežných potrieb domácnosti.</li><li><strong>Nepremokavé puzdro na doklady</strong>, kópie dôležitých dokumentov a náhradné kľúče.</li><li><strong>Papierové kontakty a mapa</strong>, pracovné rukavice, lepiaca páska a základné náradie.</li><li><strong>Funkčný hasiaci prístroj a hlásič dymu</strong>; pri spaľovacích zariadeniach aj detektor oxidu uhoľnatého podľa pokynov výrobcu.</li></ul><p>Základné vybavenie vychádza z:</p><ul><li><a href="https://www.georisques.gouv.fr/me-preparer-me-proteger/mon-kit-durgence-72h" target="_blank" rel="noopener">Francúzskeho zoznamu na 72 hodín</a>.</li><li><a href="https://www.gov.pl/web/poradnikbezpieczenstwa/przygotuj-swoje-otoczenie" target="_blank" rel="noopener">Poľského zoznamu domácich zásob</a>.</li></ul>'},
{id:'spojenie',t:'Ako zostaneme v spojení',h:'<h4>Návrh na rodinnú dohodu</h4><ul><li>Používame jednu rodinnú skupinu. Ak internet nefunguje, skúsime <strong>SMS</strong>.</li><li>Prvú správu pošleme hneď, keď je to bezpečné. Ďalšie hlásenia navrhujeme <strong>o 9.00 a 18.00 slovenského času</strong>.</li><li>Každá domácnosť potvrdí stav všetkých svojich členov.</li><li>Ak niekto neodpovedá, skúsime druhého člena domácnosti, náhradný kontakt alebo dohodnutého suseda. Samotný výpadok spojenia neznamená, že sa mu niečo stalo.</li><li>Pred cestou oznámime <strong>kto ide, kam, kadiaľ a približný čas príchodu</strong>. Po príchode pošleme potvrdenie.</li><li>Pri úplnom výpadku spojenia sa riadime vopred dohodnutým plánom a pokynmi úradov. Nevyrážame súčasne navzájom po seba.</li></ul><p><strong>Vzor správy:</strong></p><blockquote>[Mená]: sme všetci v poriadku. Sme na [miesto]. Máme vodu aj lieky. Zostávame tu. Ďalšiu správu skúsime o [čas].</blockquote><p><strong>Pri odchode:</strong></p><blockquote>[Meno]: odchádzam z [miesto] do [cieľ], trasou [trasa], o [čas]. Príchod približne [čas]. Po príchode sa ozvem.</blockquote><p>Kontakt mimo regiónu si dohodnite s človekom, ktorý súhlasí so sprostredkovaním správ. Papierovú kópiu kontaktov má každý.</p><p>Rodinné kontakty a miesta stretnutia sú súčasťou aj <a href="https://www.gov.pl/web/poradnikbezpieczenstwa/plan-na-kryzys" target="_blank" rel="noopener">oficiálneho poľského rodinného plánu</a>.</p>'},
{id:'vypadky',t:'Výpadok elektriny, vody alebo kúrenia',h:'<h4>Elektrina a telefóny</h4><p>Zapnite úsporný režim, znížte jas a obmedzte používanie telefónu. Uprednostnite krátke správy pred dlhými hovormi. Svieťte baterkami alebo čelovkami. Chladničku a mrazničku otvárajte čo najmenej.</p><p>Zatvorená chladnička udrží potraviny bezpečné približne štyri hodiny. Plná zatvorená mraznička približne 48 hodín, poloprázdna približne 24 hodín. Bezpečnosť potravín neoverujte ochutnávaním. Pri neistom chladení používajte trvanlivé zásoby.</p><h4>Voda</h4><p>Pri oznámenej odstávke naplňte čisté potravinárske nádoby, kým je voda bezpečná. Vodu na splachovanie skladujte oddelene od pitnej.</p><p>Pri upozornení na nepitnú vodu rešpektujte pokyny vodární a hygienikov. <strong>Prevarenie neodstráni palivá, toxické chemikálie ani rádioaktívnu kontamináciu.</strong> Vtedy potrebujete bezpečný náhradný zdroj.</p><h4>Teplo</h4><p>Oblečte sa vo vrstvách a používajte deky alebo spacáky. Ak je bezpečné zostať doma, sústreďte sa do jednej miestnosti.</p><p><strong>Gril, generátor ani turistický varič nepoužívajte v byte, dome alebo garáži. Plynovým sporákom ani rúrou nevykurujte.</strong></p><p>Krb alebo iné vykurovanie používajte len podľa určenia a bezpečnostných pokynov. Ak doma nemožno udržať bezpečné podmienky, využite dostupné bezpečné ubytovanie alebo miesto určené obcou.</p><p>Podrobnosti:</p><ul><li><a href="https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html" target="_blank" rel="noopener">CDC k výpadku elektriny</a>.</li><li><a href="https://www.cdc.gov/water-emergency/about/" target="_blank" rel="noopener">CDC k bezpečnej vode</a>.</li></ul>'},
{id:'batohy',t:'Evakuačné batohy',h:'<p>Pripravte <strong>osobnú evakuačnú batožinu pre každého člena domácnosti</strong>. Pri deťoch a ľuďoch potrebujúcich pomoc určte, kto ju odnesie.</p><p>Batoh má byť taký ľahký, aby ho určený nositeľ dokázal odniesť. Domáca zásoba vody zostáva samostatnou zásobou; nepočítajte s tým, že každý odnesie celých 9 až 15 litrov.</p><ul class="chk"><li>Pitná voda na cestu a trvanlivé jedlo.</li><li>Pravidelné lieky, dávkovanie a potrebné zdravotnícke pomôcky.</li><li>Kópie dokladov, papierové kontakty a menšia hotovosť.</li><li>Baterka, powerbanka a správny kábel.</li><li>Teplá vrstva, pršiplášť, náhradné ponožky a termofólia alebo ľahká prikrývka.</li><li>Základná hygiena a drobné obväzové vybavenie.</li><li>Papierová mapa, píšťalka, pero a zápisník.</li></ul><p><strong>Pri odchode pridajte:</strong> originály dokladov, telefón, kľúče a lieky alebo pomôcky, ktoré nemožno držať trvalo v batohu. Tento krátky zoznam položte navrch.</p><p>Batohy uložte na dostupné miesto, ktoré všetci poznajú. Rádio a väčšie spoločné vybavenie môžete rozdeliť medzi členov jednej domácnosti; každý však potrebuje vlastné osobné veci.</p>'},
{id:'postup',more:1,t:'Rýchly postup pri mimoriadnej udalosti',h:'<ol><li><strong>Najprv bezpečie.</strong> Pri bezprostrednom ohrození sa presuňte do bezpečia a volajte 112. Pri čisto zdravotnej tiesni volajte 155.</li><li><strong>Zistite, čo sa deje.</strong> Počúvajte miestny rozhlas, rádio a pokyny obce alebo mesta.</li><li><strong>Dajte o sebe vedieť.</strong> Pošlite krátku správu s miestom, stavom a ďalším krokom.</li><li><strong>Pripravte si vodu, lieky, baterku a rádio.</strong> Šetrite batériu telefónu.</li><li><strong>O presune rozhodujte podľa ohrozenia a pokynov.</strong> Pri nariadenej evakuácii odíďte podľa inštrukcií. Pri výpadku siete sa nezačnite automaticky navzájom hľadať.</li></ol><p>Pri volaní záchranárom povedzte: <strong>čo sa stalo, presné miesto, počet ohrozených alebo zranených a svoje meno</strong>. Riaďte sa operátorom.</p><p class="src">Zdroj: <a href="'+MV+'" target="_blank" rel="noopener">Slovenské pokyny MV SR</a>.</p>'},
{id:'miesta',more:1,t:'Kde sa stretneme a kto čo zabezpečí',h:'<p>Pre každú domácnosť dohodnite blízke miesto stretnutia mimo budovy a náhradné miesto mimo bezprostredného okolia. Blízke miesto slúži napríklad po opustení budovy. Náhradné použite, ak prvé nie je dostupné alebo bezpečné. Pokyny záchranných zložiek majú prednosť.</p><p>Pred výberom spoločného rodinného miesta mimo ohrozenej oblasti overte prístup, kapacitu pre všetkých účastníkov a súhlas hostiteľa. Žiadnu domácnosť neurčujte automaticky ako cieľ pre každú udalosť.</p><p>Pre každú domácnosť zakreslite dve možné trasy odchodu do papierovej mapy. Cieľ a konkrétnu trasu pri udalosti prispôsobte uzáverám a pokynom úradov.</p><h4>Úlohy na rozdelenie</h4><ul><li>Overiť stav blízkych potrebujúcich pomoc.</li><li>Sledovať oficiálne informácie a poslať stručné zhrnutie.</li><li>Koordinovať potrebný odvoz.</li><li>Udržiavať aktuálne kontakty a vytlačený plán.</li></ul><p>V každej domácnosti si osobitne určte, kto pri odchode berie lieky, doklady, rádio a spoločné vybavenie. Ak je niekto sám doma, musí vedieť odísť aj bez ostatných.</p>'},
{id:'sireny',more:1,t:'Sirény, povodeň a ozbrojený konflikt',h:'<h4>Slovenské varovné signály</h4><div class="tw"><table><thead><tr><th>Signál</th><th>Zvuk</th></tr></thead><tbody><tr><td>Všeobecné ohrozenie</td><td>2 minúty kolísavý tón</td></tr><tr><td>Ohrozenie vodou</td><td>6 minút stály tón</td></tr><tr><td>Koniec ohrozenia</td><td>2 minúty stály tón, doplnený slovnou informáciou</td></tr></tbody></table></div><p>Po siréne počúvajte <strong>slovnú informáciu</strong>, ktorá vysvetlí ohrozenie a postup. Skúška sirén môže mať rovnaký stály tón ako koniec ohrozenia; riaďte sa oznámením a kontextom.</p><p class="src">Zdroj: <a href="https://static.slov-lex.sk/static/SK/ZZ/1994/42/20250701.print.html" target="_blank" rel="noopener">Oficiálne pravidlá varovania</a>.</p><h4>Pri povodni</h4><p>Nevstupujte do zaplavených pivníc ani podzemných garáží a nejazdite cez zaplavené cesty. Pri bezprostrednom ohrození vodou choďte na bezpečné vyvýšené miesto. Elektrinu či iné prívody odpájajte len vtedy, ak je to bezpečné.</p><p>Sledujte pokyny vlastnej obce alebo mesta; pri odvoze sa riaďte aktuálne priechodnými trasami. Nejazdite do ohrozenej oblasti iba preto, že sa nepodarilo telefonické spojenie.</p><p class="src">Zdroj: <a href="https://www.minv.sk/swift_data/source/civilna_ochrana/mimoriadne_udalosti_odporucnia/01_Ako_postupovat%20-%20v%20pripade%20povodne.pdf" target="_blank" rel="noopener">Pokyny MV SR pri povodni</a>.</p><h4>Pri vzdušnom poplachu alebo pokyne ukryť sa</h4><p>Vyhľadajte určené alebo vhodné chránené miesto podľa pokynov civilnej ochrany. Držte sa mimo okien a vezmite dostupné lieky, vodu, rádio a doklady.</p><p>Vopred si pri obci, mestskej časti alebo správcovi overte miesto ukrytia a prístup k nemu.</p><p><strong>Miesto ukrytia nie je univerzálne pre všetky udalosti.</strong> Pivnica nevhodná pri povodni môže mať iný význam pri inom type ohrozenia. Rozhodujú konkrétne pokyny.</p><p>Pri nariadenej evakuácii zoberte pripravené veci a postupujte podľa inštrukcií. Pred odchodom pošlite rodine cieľ a trasu, ak to situácia dovolí. Nešírte neoverené správy ani fotografie pohybu vojenských jednotiek.</p>'},
{id:'tiesnove',foot:1,t:'Tiesňové čísla a oficiálne informácie',h:'<div class="tw"><table><thead><tr><th>Číslo na Slovensku</th><th>Kedy volať</th></tr></thead><tbody><tr><td class="num"><a href="tel:112">112</a></td><td>Ohrozenie života, zdravia, majetku alebo potreba viacerých záchranných zložiek</td></tr><tr><td class="num"><a href="tel:155">155</a></td><td>Zdravotná tiesňová situácia</td></tr><tr><td class="num"><a href="tel:150">150</a></td><td>Hasiči</td></tr><tr><td class="num"><a href="tel:158">158</a></td><td>Polícia</td></tr></tbody></table></div><p>Tiesňové linky používajte pri núdzi, nie na zisťovanie dĺžky bežnej odstávky.</p><p class="src">Zdroj: <a href="'+MV+'" target="_blank" rel="noopener">Príručka MV SR</a>.</p><p>Uložte si a vytlačte:</p><ul><li><strong>Vaša obec, mesto alebo mestská časť:</strong> doplňte oficiálnu webovú adresu a kontakt; sledujte aj oznamy miestneho rozhlasu.</li><li><strong>Ministerstvo vnútra:</strong> <a href="https://www.minv.sk/" target="_blank" rel="noopener">minv.sk</a></li><li><strong>Počasie a hydrologické výstrahy:</strong> <a href="https://www.shmu.sk/" target="_blank" rel="noopener">shmu.sk</a></li><li><strong>Informácie bez internetu:</strong> rádio na batérie, vysielanie Slovenského rozhlasu a miestny rozhlas. <button class="ref" data-ref="offline">Viac v časti B</button></li></ul><p>Do papierovej prílohy doplňte čísla vlastného dodávateľa elektriny, vodární, správcu domu, poisťovne a lekára podľa zmlúv alebo ich oficiálnych stránok.</p>'},
{id:'sedem',plan:1,t:'Plán na 7 dní',h:'<div class="tw"><table><thead><tr><th>Deň</th><th>Úloha</th></tr></thead><tbody><tr><td class="num">1</td><td>Spoločne vyplniť kontakty, miesta stretnutia, náhradný kontakt, pravidlá spojenia a úlohy</td></tr><tr><td class="num">2</td><td>Pripraviť vodu podľa počtu osôb a jedlo na tri dni v každej domácnosti</td></tr><tr><td class="num">3</td><td>Skontrolovať lieky, lekárničky, hygienu a teplé oblečenie</td></tr><tr><td class="num">4</td><td>Pripraviť doklady, hotovosť, papierové mapy a kontakty</td></tr><tr><td class="num">5</td><td>Pripraviť osobnú evakuačnú batožinu pre každého a rozdeliť spoločné vybavenie</td></tr><tr><td class="num">6</td><td>Overiť núdzový prístup k účtom, offline zálohy a dohodnúť overovaciu frázu <button class="ref" data-ref="podvod">Fráza a podvody v časti B</button></td></tr><tr><td class="num">7</td><td>Vyskúšať rádio, baterky, powerbanky, SMS a prejsť si postup odchodu</td></tr></tbody></table></div><p><strong>Návrh na rodinnú dohodu:</strong> každé tri mesiace krátka kontrola zásob a batérií; raz ročne spoločné prejdenie celého plánu. Po použití zásoby doplniť.</p><p>Po doplnení vytlačte jednu kópiu pre každú domácnosť a stručné kontakty pre každého do batohu. Papierová verzia má obsahovať aj konkrétne miesta stretnutia, dohodnuté časy spojenia a rozdelené úlohy.</p>'},
{id:'zdroje',foot:1,t:'Zdroje a základ prípravy',h:'<p>Spoločným základom pôvodných odporúčaní je pripravenosť aspoň na tri dni. Na výpočet základnej zásoby používame 3 litre vody na osobu denne; slovenská príručka uvádza rozsah 3 až 5 litrov. Francúzsky zoznam uvádza 6 litrov balenej vody na osobu v súprave na 72 hodín, preto jednotlivé množstvá nie sú vo všetkých krajinách rovnaké.</p><ul><li><a href="'+MV+'" target="_blank" rel="noopener">MV SR a slovenská príručka ku krízam a ozbrojenému konfliktu</a>.</li><li><a href="https://www.gov.pl/web/poradnikbezpieczenstwa/przygotuj-swoje-otoczenie" target="_blank" rel="noopener">Poľsko a domáce zásoby na minimálne tri dni</a>.</li><li><a href="https://www.georisques.gouv.fr/me-preparer-me-proteger/mon-kit-durgence-72h" target="_blank" rel="noopener">Francúzsko a súprava na 72 hodín</a>.</li><li><a href="https://beready.campaign.gov.uk/" target="_blank" rel="noopener">Spojené kráľovstvo a Be Ready</a>.</li></ul><p>Konkrétne rodinné dohody, kontakty a rozdelenie úloh doplňte podľa potrieb svojej domácnosti. Pri udalosti majú prednosť aktuálne pokyny záchranných zložiek a príslušných úradov.</p>'}],
B:[
{id:'pristup',t:'Prístup k dôležitým veciam',h:'<ul><li>Používajte <strong>správcu hesiel</strong>, jedinečné heslá a <strong>dvojfaktorové overenie alebo prístupové kľúče</strong> všade, kde sú dostupné.</li><li>Obnovovacie kódy a návod na núdzový prístup uchovajte <strong>na papieri v uzamknutom mieste</strong>. Zapečatenú zálohu možno zveriť dohodnutej dôveryhodnej osobe.</li><li><strong>Heslá, PIN ani obnovovacie kódy nevpisujte do tejto príručky alebo rodinnej skupiny.</strong></li><li>Základné kontakty, plán a dôležité dokumenty majte aj na papieri; digitálnu zálohu na <strong>šifrovanom USB</strong>. Overte, že ju viete otvoriť.</li></ul><p>'+RF('sedem','Deň 6 v pláne na 7 dní')+'</p>'},
{id:'podvod',t:'Podozrivá žiadosť a overovacia fráza',h:'<h4>Návrh na rodinnú dohodu</h4><p>Zvoľte si <strong>súkromnú overovaciu frázu</strong>. Jej znenie si dohodnite osobne a nedávajte ho do zdieľanej príručky.</p><p>Ak niekto telefonuje v mene člena rodiny alebo blízkeho človeka a naliehavo žiada peniaze:</p><ol><li><strong>Hovor ukončite.</strong></li><li>Zavolajte danej osobe na jej <strong>už uložené číslo</strong>.</li><li>Overte žiadosť aj cez ďalšieho člena rodiny. Samotný známy hlas alebo správna fráza nie sú dôvodom preskočiť overenie.</li><li>Nikomu neposielajte jednorazové bankové kódy, PIN ani prihlasovacie údaje.</li></ol><p>NBS upozorňuje aj na napodobňovanie hlasov pomocou AI. Neinštalujte aplikáciu na pokyn neznámeho volajúceho a nepresúvajte peniaze na údajný „bezpečný účet“.</p><p>'+RF('sedem','Deň 6 v pláne na 7 dní')+'</p><p class="src">Zdroj: <a href="https://nbs.sk/pozor-na-podvody/" target="_blank" rel="noopener">NBS k podvodom</a>.</p>'},
{id:'banker',t:'Falošný bankár, polícia alebo NBS',more:0,h:'<ul><li>NBS nikdy nekontaktuje ľudí kvôli záchrane peňazí ani nežiada citlivé údaje. „Bezpečný účet“ neexistuje.</li><li>Banka ani polícia nežiadajú prístupové údaje, PIN ani SMS kódy a nepýtajú peniaze cez telefón.</li><li>Číslo na displeji môže byť sfalšované. Znakom podvodu je nátlak a časový stres.</li><li>Hovor ukončite a zavolajte späť na oficiálne číslo banky alebo polície (158).</li><li>Neinštalujte aplikáciu na pokyn volajúceho.</li></ul><p class="src">Návrh Plánu B. Zdroje: <a href="https://www.startitup.sk/?p=1118081" target="_blank" rel="noopener">NBS</a>, <a href="https://www.tatrabanka.sk/predigitalnubezpecnost/?p=2786" target="_blank" rel="noopener">Tatra banka</a>, <a href="https://sita.sk/vofinanciach/podvodnici-menia-taktiku-slovaci-prichadzaju-o-miliony-seniori-uz-o-viac-nez-sedem-milionov-eur/" target="_blank" rel="noopener">SITA</a>.</p>'},
{id:'naletel',t:'Čo robiť, ak som na podvod naletel',h:'<ol><li>Kontaktujte svoju banku cez oficiálnu infolinku.</li><li>Podvod nahláste polícii alebo cez <a href="https://podanie.nbs.sk/" target="_blank" rel="noopener">podanie.nbs.sk</a>.</li><li>Zaznamenajte si číslo a obsah hovoru. Môže pomôcť pri vyšetrovaní.</li><li>Informujte rodinu a priateľov, aby sa podvod nezopakoval.</li></ol><p class="src">Návrh Plánu B. Zdroje: <a href="https://www.eba.europa.eu/sites/default/files/2026-01/fa63af9a-bafd-4821-baee-48c7c8fb6490/Online%20financial%20frauds%20and%20scams%20in%20an%20AI%20world_SK.pdf" target="_blank" rel="noopener">EBA</a>, <a href="https://www.tatrabanka.sk/predigitalnubezpecnost/hrozba/nenalette-podvodnym-hovorom-od-falosnych-policajtov-bankarov-ci-pracovnikov-nbs/" target="_blank" rel="noopener">Tatra banka</a>.</p>'},
{id:'offline',t:'Informácie bez internetu',h:'<ul><li>Rádio na batérie, vysielanie Slovenského rozhlasu a miestny rozhlas.</li><li>Dôležité pokyny nenechávajte iba v AI aplikácii, e-maile alebo cloude. Majte ich aj na papieri.</li></ul><p>'+RF('tiesnove','Oficiálne kontakty a stránky v časti A')+'</p>'},
{id:'hlas',t:'Klonovanie hlasu',more:1,h:'<ul><li>Na napodobenie hlasu stačí pár minút nahrávky zo streamu alebo videa na sociálnej sieti.</li><li>Opatrne zverejňujte podrobné osobné údaje, plány ciest a polohu v reálnom čase.</li><li>Dohodnutá rodinná fráza a spätné zavolanie na uložené číslo ostávajú najlepšou obranou.</li></ul><p class="src">Návrh Plánu B. Zdroje: <a href="https://www.startitup.sk/?p=840414" target="_blank" rel="noopener">Startitup</a>, <a href="https://www.ic3.gov/psa/2024/psa241203" target="_blank" rel="noopener">FBI IC3</a>.</p>'},
{id:'dezinfo',t:'Overovanie správ a deepfake',more:1,h:'<ul><li>Pred zdieľaním sa zastavte a počkajte, kým opadne prvá emócia.</li><li>Zistite, či informáciu uvádzajú aj iné zdroje, a pozrite si stránku na overovanie faktov.</li><li>Informácie o mimoriadnych udalostiach čerpajte z oficiálnych zdrojov (ministerstvo vnútra, polícia, obec).</li><li>Detektory AI obsahu nie sú spoľahlivé na 100 %.</li></ul><p class="src">Návrh Plánu B. Zdroje: <a href="https://slovakia.representation.ec.europa.eu/news/ako-nepodlahnut-dezinformaciam-prinasame-pat-tipov-od-odbornikov-2022-05-06_sk" target="_blank" rel="noopener">Európska komisia</a>, <a href="https://www.teraz.sk/slovensko/mv-sr-varuje-pred-deepfake-nahravkami/782672-clanok.html" target="_blank" rel="noopener">MV SR</a>, <a href="https://efcsn.com/wp-content/uploads/2024/06/AI@EUElections-1-Pager-SLOVAK.pdf" target="_blank" rel="noopener">EFCSN</a>.</p>'},
{id:'zdrojeB',foot:1,t:'Zdroje a dôležité kontakty',h:'<ul><li><strong>Polícia: 158.</strong> Pri podozrení na podvod volajte priamo, nie na číslo z podozrivého hovoru.</li><li><a href="https://nbs.sk/pozor-na-podvody/" target="_blank" rel="noopener">NBS: Pozor na podvody</a></li><li><a href="https://podanie.nbs.sk/" target="_blank" rel="noopener">NBS: podanie sťažnosti alebo hlásenia</a></li><li><a href="https://www.sk-cert.sk/" target="_blank" rel="noopener">SK-CERT: národné centrum kybernetickej bezpečnosti</a></li><li><a href="https://www.eba.europa.eu/sites/default/files/2026-01/fa63af9a-bafd-4821-baee-48c7c8fb6490/Online%20financial%20frauds%20and%20scams%20in%20an%20AI%20world_SK.pdf" target="_blank" rel="noopener">EBA: Online finančné podvody v ére AI (PDF)</a></li><li><a href="https://commission.europa.eu/topics/countering-information-manipulation/building-societal-resilience-against-information-manipulation_sk" target="_blank" rel="noopener">Európska komisia: ako rozpoznať manipuláciu s informáciami</a></li></ul><p class="src">Okrem NBS ide o návrh Plánu B.</p>'}
]};

var AIINTRO='<p class="leadp"><strong>Táto revolúcia sa deje exponenciálne rýchlo.</strong></p><p>Počúvam, že si ľudstvo vždy poradilo. Zvládli sme sociálne siete? Alebo priniesli novú pandémiu závislostí, desocializáciu a negatívne ovplyvnili demokraciu vo svete?</p><p>Táto doba prináša neuveriteľné množstvo nástrah. Je lepšie byť pripravený na tie najzákladnejšie.</p><p>Vypnúť si správy zníži úzkosť, ale neinformovanosť nič nevyrieši. Pomáha len cielená aktivita, príprava.</p><p class="leadp"><strong>Jeden príklad toho, čo prinesie AI.</strong> Nie je to zbytočný alarmizmus. Stačia na úvod 2 minúty.</p>';
var KOINTRO='<p class="lead">Prečo sa tým vôbec zaoberať?</p><p>Vojnový reportér Tomáš Forró vydal <a href="https://www.martinus.sk/4448301-prirucka-prezitia-a-spolocenskej-odolnosti/kniha" target="_blank" rel="noopener">Príručku prežitia a spoločenskej odolnosti</a>. Nejde o strašenie. Forró hovorí, že jeho cieľom je ľudí informovať a pomôcť im racionálne spracovať obavy, aby vedeli, čo môžu robiť.</p><p class="leadp"><strong>Presne o to ide aj tu: menej úzkosti, viac pripravenosti.</strong></p><p>Pozri si prvé 2 minúty rozhovoru. Tip na čítanie: Tomáš Forró, <a href="https://www.martinus.sk/4448301-prirucka-prezitia-a-spolocenskej-odolnosti/kniha" target="_blank" rel="noopener">Príručka prežitia a spoločenskej odolnosti</a> (2026).</p><p><strong>Odporúčania na tejto stránke vychádzajú z oficiálnych príručiek</strong> pre obyvateľov: <a href="https://www.gov.pl/web/poradnikbezpieczenstwa/przygotuj-swoje-otoczenie" target="_blank" rel="noopener">Poľsko</a>, <a href="https://www.georisques.gouv.fr/me-preparer-me-proteger/mon-kit-durgence-72h" target="_blank" rel="noopener">Francúzsko</a> a <a href="https://beready.campaign.gov.uk/" target="_blank" rel="noopener">Spojené kráľovstvo</a>.</p>';

var KEY='planb.v4',mem=null,S={screen:'intro',i:0,ans:[],done:false};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.ans)){S.ans=o.ans.slice(0,6);S.i=Math.min(+o.i||0,5);S.done=!!o.done}}}catch(e){if(mem){S.ans=mem.ans;S.i=mem.i;S.done=mem.done}}}
function save(){var o={ans:S.ans,i:S.i,done:S.done};mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function clr(){S.ans=[];S.i=0;S.done=false;mem=null;try{localStorage.removeItem(KEY)}catch(e){}}
var $=function(s){return document.querySelector(s)};
var app=$('#app'),nav=$('#nav');
function answered(){return S.ans.filter(function(a){return a!==undefined&&a!==null}).length}
function firstOpen(){for(var i=0;i<6;i++){if(S.ans[i]===undefined||S.ans[i]===null)return i}return 5}
function go(screen,extra){S.screen=screen;if(extra)for(var k in extra)S[k]=extra[k];render();window.scrollTo(0,0);app.focus({preventScroll:true})}
function renderNav(){
 var items=[['test',S.done?'Výsledok':'Test',S.done?'Tvoje skóre':'1 minúta',''],['partA','A','Mimoriadne situácie','A'],['partB','B','Hrozby AI doby','B']];
 var cur=S.screen;if(cur==='intro'||cur==='q'||cur==='block'||cur==='result')cur='test';
 nav.innerHTML=items.map(function(it){return '<button class="'+it[3]+'" data-go="'+it[0]+'"'+(cur===it[0]?' aria-current="page"':'')+'><span class="nl">'+it[1]+'</span><span class="ns">'+it[2]+'</span></button>'}).join('');
}

 var started=answered()>0&&!S.done;
 return '<section class="screen"><div class="lab">Plán B</div><h1 style="margin-top:10px"><span class="hlG">Pripraveným</span> šťastie praje</h1><p class="sub">Alebo: Zľahčovanie, obavy, zámerná nevedomosť ani nádej nie sú riešením.</p>'+
 '<div class="cards"><button class="pcard A" data-go="partA"><div class="row"><span class="badge">A</span><span class="t">Mimoriadne situácie</span></div><div class="d">Prvých 72 hodín: výpadky, povodeň, sirény.</div></button>'+
 '<button class="pcard B" data-go="partB"><div class="row"><span class="badge">B</span><span class="t">Hrozby AI doby</span></div><div class="d">Heslá, podvody a informácie bez internetu.</div></button></div>'+
 '<button class="btn" id="start">'+(S.done?'Pozrieť výsledok':started?'Pokračovať v teste':'Spustiť test (1 minúta)')+'</button>'+
 (S.done?'<div id="retake"><button class="lnk" id="rt">Urobiť test znova</button></div>':started?'<div id="retake"><button class="lnk" id="rt">Začať test odznova</button></div>':'<button class="lnk" data-go="partA">Preskočiť test a čítať</button>')+
 '<p class="note">6 otázok, odpoveď jedným ťuknutím. Bez registrácie a bez zbierania údajov.</p></section>';
}

 var opts=[['yes','Áno'],['part','Čiastočne'],['no','Nie']];if(q.na)opts.push(['na','Netýka sa nás']);
 return '<section class="screen"><div class="qhead"><button class="back" id="back" aria-label="Späť">← Späť</button><span class="lab">'+n+' z 6</span></div>'+

 '<div class="ans" role="group" aria-label="Odpoveď">'+opts.map(function(o){return '<button class="arow '+q.p+(cur===o[0]?' on':'')+'" data-a="'+o[0]+'"><span class="box" aria-hidden="true"></span><span>'+o[1]+'</span></button>'}).join('')+'</div>'+
 (q.na?'<div class="hint">Ak nikto v domácnosti lieky nepotrebuje, vyber „Netýka sa nás“. Otázka sa do skóre nepočíta.</div>':'')+'</section>';
}
function blockScreen(){
 return '<section class="screen blockscr"><div class="badge B">B</div><div class="lab">Časť B</div><h2 style="margin:8px 0 14px"><span class="hlB">Hrozby AI doby</span></h2><p>Ešte 3 otázky. Týkajú sa hesiel, podvodov a toho, čo máš mimo internetu.</p><button class="btn" id="cont" style="margin-top:22px">Pokračovať</button><button class="lnk" id="back2">← Späť na predošlú otázku</button></section>';
}
function scoreCard(p,c,g){
 var gh=g.length?g.map(function(q){return '<div class="gap"><span class="tag '+p+'">Tvoja medzera</span><div class="gq">'+q.q+'</div><div class="gs">'+q.s+'</div></div>'}).join(''):'<div class="ok">Tu nemáš žiadnu medzeru. Prejdi plán s blízkymi a vyskúšaj ho v praxi.</div>';
 var note=c.pct>=75&&g.length?'<p style="margin:0 0 10px">Výborne, väčšinu máš hotovú. Tieto veci ešte doladíš:</p>':'';
 return '<div class="score '+p+'"><div class="hd"><div><div class="lab" style="color:var(--ink)">'+p+' · '+PART[p].name+'</div><div class="band">'+band(c.pct)+'</div></div><div class="pct">'+c.pct+'<span style="font-size:32px"> %</span></div></div><div class="sb">'+
 '<div class="ruler" role="img" aria-label="Skóre '+c.pct+' percent"><div class="fill" data-w="'+c.pct+'"></div><div class="tick" style="left:40%"></div><div class="tick" style="left:75%"></div><span class="tl" style="left:40%">40</span><span class="tl" style="left:75%">75</span></div>'+
 '<div class="lab" style="margin-bottom:6px;color:var(--ink)">'+(g.length?'Tu začni':'Hotovo')+'</div>'+note+gh+
 '<button class="btn alt" style="margin-top:14px" data-go="part'+p+'">Otvoriť časť '+p+'</button></div></div>';
}
function resultScreen(){
 var cA=calc(S.ans,'A'),cB=calc(S.ans,'B'),order=cA.pct<=cB.pct?['A','B']:['B','A'];
 var cs={A:cA,B:cB};
 var h='<section class="screen"><div class="lab">Výsledok</div><h2 style="margin:8px 0 20px">Tvoja <span class="hl'+order[0]+'">pripravenosť</span></h2>';
 order.forEach(function(p){h+=scoreCard(p,cs[p],gaps(S.ans,p))});
 h+='<div id="retake"><button class="btn alt" id="rt">Urobiť test znova</button></div></section>';

}
function videoBlock(p){
 var v=VID[p];
 return '<div class="video" id="vid"><button class="vbtn" id="vplay" aria-label="'+v.label+'"><span class="pl" aria-hidden="true">▶</span><span>'+v.label+'</span></button></div><p class="vlink"><a href="https://youtu.be/'+v.id+(v.s?'?t='+v.s:'')+'" target="_blank" rel="noopener">Otvoriť na YouTube</a></p>';
}
function partScreen(p){
 var gapSecs={};if(S.done)gaps(S.ans,p).forEach(function(q){gapSecs[q.sec]=1});
 var list=SEC[p].filter(function(s){return !s.plan&&!s.foot}),withGap=list.filter(function(s){return gapSecs[s.id]}),rest=list.filter(function(s){return !gapSecs[s.id]});
 var ordered=withGap.concat(rest);
 var h='<section class="screen"><div class="parthead '+p+'"><p class="claim">Be prepared, or prepare to fail.</p><div class="lab ph" style="color:var(--ink)">Časť <span class="badge">'+p+'</span></div><h2>'+PART[p].name+'</h2></div><div class="intro">'+(p==='A'?KOINTRO:AIINTRO)+'</div>'+videoBlock(p)+
 '<div style="height:14px"></div>';
 var mainL=ordered.filter(function(s){return !s.more||gapSecs[s.id]}),moreL=ordered.filter(function(s){return s.more&&!gapSecs[s.id]});
 function sec(s){return '<details id="s-'+s.id+'"><summary><span>'+s.t+'</span>'+'<span class="pm" aria-hidden="true"></span></summary><div class="dbody">'+s.h+'</div></details>'}
 mainL.forEach(function(s){h+=sec(s)});
 if(moreL.length){h+='<details class="more" id="s-more"><summary><span>Ďalšie ('+moreL.length+')</span><span class="pm" aria-hidden="true"></span></summary><div class="dbody">'+moreL.map(sec).join('')+'</div></details>'}
 var pl=SEC.A.filter(function(s){return s.plan})[0];
 h+='<div class="plan" id="s-sedem"><div class="lab" style="color:var(--ink)">Cieľ</div><h3 style="margin:6px 0 12px"><span class="hlG">'+pl.t+'</span></h3><p>Sem to celé smeruje: za týždeň máte pripravenú domácnosť aj rodinu, časť A aj B.</p>'+pl.h+'<a class="btn" href="'+mailPlan()+'">Poslať si plán na e-mail</a><p class="note" style="margin-top:8px">Otvorí sa Tvoja e-mailová aplikácia. Stránka nič neodosiela.</p></div>';
 if(!S.done)h+='<div class="hint" style="margin-top:18px">Chceš vedieť, ktoré kroky sú pre teba najdôležitejšie? <button class="lnk" style="display:inline;width:auto;padding:0;margin:0" data-go="'+(answered()>0?'q':'intro')+'">Urob test (1 minúta)</button>.</div>';
 var ft=SEC[p].filter(function(s){return s.foot});
 if(ft.length)h+='<div class="foot">'+ft.map(function(s){return '<div id="s-'+s.id+'"><h3>'+s.t+'</h3><div class="dbody" style="padding:12px 0 0">'+s.h+'</div></div>'}).join('')+'</div>';
 return h+'</section>';

function mailPlan(){
 var d=['Spoločne vyplniť kontakty, miesta stretnutia, náhradný kontakt, pravidlá spojenia a úlohy','Pripraviť vodu podľa počtu osôb a jedlo na tri dni v každej domácnosti','Skontrolovať lieky, lekárničky, hygienu a teplé oblečenie','Pripraviť doklady, hotovosť, papierové mapy a kontakty','Pripraviť osobnú evakuačnú batožinu pre každého a rozdeliť spoločné vybavenie','Overiť núdzový prístup k účtom, offline zálohy a dohodnúť overovaciu frázu','Vyskúšať rádio, baterky, powerbanky, SMS a prejsť si postup odchodu'];

function render(){

 if(S.screen==='intro')h=introScreen();
 else if(S.screen==='q')h=qScreen();
 else if(S.screen==='block')h=blockScreen();
 else if(S.screen==='result')h=resultScreen();

 else if(S.screen==='partB')h=partScreen('B');
 app.innerHTML=h;renderNav();
 var f=app.querySelectorAll('.fill');if(f.length)setTimeout(function(){f.forEach(function(e){e.style.width=e.getAttribute('data-w')+'%'})},60);

function pick(a){
 S.ans[S.i]=a;save();
 var rows=app.querySelectorAll('.arow');rows.forEach(function(r){r.classList.toggle('on',r.getAttribute('data-a')===a)});
 setTimeout(function(){
  if(S.i===5){S.done=true;save();S.screen='result';render();window.scrollTo(0,0);app.focus({preventScroll:true})}
  else{S.i++;save();S.screen='q';render();window.scrollTo(0,0);app.focus({preventScroll:true})}
 },260);
}
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 var rf=t.getAttribute('data-ref');
 if(rf){if(!document.getElementById('s-'+rf)){var tp=SEC.A.some(function(x){return x.id===rf})?'A':'B';go('part'+tp)}
  var d=document.getElementById('s-'+rf);if(d){var m=d.closest('details.more');if(m)m.open=true;d.open=true;d.scrollIntoView()}
  return}
 var g=t.getAttribute('data-go');
 if(g){
  if(g==='test'){if(S.done)go('result');else if(answered()>0)go('q',{i:firstOpen()});else go('intro')}
  else if(g==='q')go('q',{i:firstOpen()});
  else go(g);
  return;
 }
 if(t.id==='home'){go('intro');return}
 if(t.id==='start'){if(S.done)go('result');else go('q',{i:answered()>0?firstOpen():0});return}
 if(t.hasAttribute('data-a')){pick(t.getAttribute('data-a'));return}
 if(t.id==='back'){if(S.i===0)go('intro');else go('q',{i:S.i-1});return}
